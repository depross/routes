name: Fetch OSM data

# Fetches OpenStreetMap geometry for a route area from the Overpass API
# and commits it gzipped under data/. Used while building route pages;
# the result is baked into the page, nothing is fetched at runtime.

on:
  workflow_dispatch:
    inputs:
      bbox:
        description: "south,west,north,east"
        required: true
        default: "50.825,2.650,50.858,2.705"
      name:
        description: "artifact name"
        required: true
        default: "osm"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Overpass
        env:
          BBOX: ${{ github.event.inputs.bbox }}
        run: |
          Q='[out:json][timeout:90];(way["highway"]('"$BBOX"');way["railway"="rail"]('"$BBOX"');way["natural"~"^(water|wood|scrub|grassland)$"]('"$BBOX"');way["landuse"~"^(forest|wood|orchard|meadow)$"]('"$BBOX"');way["waterway"~"^(river|canal|stream|ditch)$"]('"$BBOX"');way["leisure"~"^(park|nature_reserve)$"]('"$BBOX"');way["boundary"="national_park"]('"$BBOX"');relation["leisure"="nature_reserve"]('"$BBOX"'););out geom;'
          : > errors.txt
          for ROUND in 1 2 3; do
            for H in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass.osm.ch/api/interpreter; do
              echo "round $ROUND trying $H"
              curl -sS -m 300 --data-urlencode "data=$Q" "$H" -o osm.json || true
              if python3 -c "import json,sys;d=json.load(open('osm.json'));assert d.get('elements');print(len(d['elements']),'elements')"; then
                break 2
              fi
              echo "--- $H round $ROUND" >> errors.txt; head -c 600 osm.json >> errors.txt 2>/dev/null || true; echo >> errors.txt
              rm -f osm.json; sleep 20
            done
            sleep 60
          done
          test -s osm.json || { mkdir -p data; cp errors.txt "data/${{ github.event.inputs.name }}.error.txt"; git config user.name osm-fetch; git config user.email osm-fetch@users.noreply.github.com; git add data; git commit -m "OSM fetch failed: ${{ github.event.inputs.name }}"; git push; exit 1; }
      - name: Commit to data/
        env:
          NAME: ${{ github.event.inputs.name }}
        run: |
          git config user.name "osm-fetch"
          git config user.email "osm-fetch@users.noreply.github.com"
          mkdir -p data
          gzip -9 -c osm.json > "data/$NAME.osm.json.gz"
          git add data
          git commit -m "OSM data: $NAME" || echo "nothing to commit"
          git push
